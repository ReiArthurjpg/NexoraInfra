# ==============================================================================
# Nexora — Docker Compose Unificado
# ==============================================================================
# Este arquivo orquestra TODOS os serviços do ecossistema Nexora.
#
# PRÉ-REQUISITO: Todos os repositórios devem estar no mesmo diretório pai:
#   parent/
#   ├── CICD/           (este repositório)
#   ├── AuthNexora/     (API de autenticação)
#   ├── IANexora/       (API de chat com IA)
#   └── brainNexora/    (API de busca em documentação)
#
# COMO USAR:
#   docker compose up -d          → Subir todos os serviços
#   docker compose down           → Parar todos os serviços
#   docker compose logs -f        → Ver logs em tempo real
# ==============================================================================

services:

  # ════════════════════════════════════════════════════════════════════════════
  # DATABASE — MySQL 8.0 (compartilhado por AuthNexora e IANexora)
  # ════════════════════════════════════════════════════════════════════════════
  db:
    image: mysql:8.0
    container_name: authnexora-db
    restart: unless-stopped
    tty: true
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
    volumes:
      - nexora-db-data:/var/lib/mysql
      # Init scripts — executados automaticamente no primeiro boot
      - ./database/init/00_init.sql:/docker-entrypoint-initdb.d/00_init.sql
      - ./database/schemas:/docker-entrypoint-initdb.d/schemas
      - ./database/seeds:/docker-entrypoint-initdb.d/seeds
    networks:
      - nexora-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ════════════════════════════════════════════════════════════════════════════
  # PHPMYADMIN — Interface de gerenciamento do banco
  # ════════════════════════════════════════════════════════════════════════════
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: authnexora-phpmyadmin
    restart: unless-stopped
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: authnexora-db
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
    networks:
      - nexora-network
    depends_on:
      db:
        condition: service_healthy

  # ════════════════════════════════════════════════════════════════════════════
  # AUTH NEXORA — API de Autenticação (PHP 8.2 + Nginx)
  # ════════════════════════════════════════════════════════════════════════════
  authnexora-api:
    build:
      context: ../AuthNexora/api
      dockerfile: Dockerfile
    image: authnexora-api
    container_name: authnexora-api
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: api
      SERVICE_TAGS: dev
      DB_HOST: authnexora-db
      DB_PORT: "3306"
      DB_DATABASE: ${AUTH_DB_DATABASE:-authnexora}
      DB_USERNAME: ${AUTH_DB_USERNAME:-root}
      DB_PASSWORD: ${AUTH_DB_PASSWORD:-rootpassword}
      APP_BASE_URL: ${AUTH_APP_BASE_URL:-http://localhost:8080}
      FRONTEND_RESET_URL: ${AUTH_FRONTEND_RESET_URL:-http://localhost:3000/reset-password/guest/reset-password}
      FRONTEND_URL: ${AUTH_FRONTEND_URL:-http://localhost:3000}
      JWT_SECRET: ${AUTH_JWT_SECRET:-change-me}
      JWT_ISSUER: ${AUTH_JWT_ISSUER:-authnexora-api}
      JWT_EXPIRES_IN: ${AUTH_JWT_EXPIRES_IN:-3600}
      MAIL_HOST: ${AUTH_MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${AUTH_MAIL_PORT:-465}
      MAIL_USERNAME: ${AUTH_MAIL_USERNAME:-}
      MAIL_PASSWORD: ${AUTH_MAIL_PASSWORD:-}
      MAIL_FROM_EMAIL: ${AUTH_MAIL_FROM_EMAIL:-}
      MAIL_FROM_NAME: ${AUTH_MAIL_FROM_NAME:-Nexora}
      GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${AUTH_GOOGLE_CLIENT_SECRET:-}
    volumes:
      - ../AuthNexora/api:/var/www
    networks:
      - nexora-network
    depends_on:
      db:
        condition: service_healthy

  authnexora-web:
    image: nginx:alpine
    container_name: authnexora-web
    restart: unless-stopped
    tty: true
    ports:
      - "${AUTH_WEB_PORT:-8080}:80"
    volumes:
      - ../AuthNexora/api:/var/www
      - ./nginx/authnexora.conf:/etc/nginx/conf.d/default.conf
    networks:
      - nexora-network
    depends_on:
      - authnexora-api

  # ════════════════════════════════════════════════════════════════════════════
  # IA NEXORA — API de Chat com IA (PHP 8.2 + Nginx)
  # ════════════════════════════════════════════════════════════════════════════
  ianexora-api:
    build:
      context: ../IANexora
      dockerfile: Dockerfile
    image: ianexora-api
    container_name: ianexora-api
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: api
      SERVICE_TAGS: dev
      DB_HOST: authnexora-db
      DB_PORT: "3306"
      DB_DATABASE: ${IA_DB_DATABASE:-ai_knowledge_base}
      DB_USERNAME: ${IA_DB_USERNAME:-root}
      DB_PASSWORD: ${IA_DB_PASSWORD:-rootpassword}
      AUTH_API_URL: ${IA_AUTH_API_URL:-http://authnexora-web}
      GEMINI_BASE_URL: ${IA_GEMINI_BASE_URL:-https://generativelanguage.googleapis.com}
      GEMINI_API_KEY: ${IA_GEMINI_API_KEY:-}
      GEMINI_MODEL: ${IA_GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_SYSTEM_PROMPT: ${IA_GEMINI_SYSTEM_PROMPT:-Você é o assistente virtual oficial da Nexora BJJ}
      APP_URL: ${IA_APP_URL:-http://localhost:8082}
      APP_FRONTEND_URL: ${IA_APP_FRONTEND_URL:-http://localhost:3000}
      UPLOAD_PATH: ${IA_UPLOAD_PATH:-storage/uploads}
      MAX_UPLOAD_SIZE: ${IA_MAX_UPLOAD_SIZE:-5242880}
      BRAIN_API_URL: ${IA_BRAIN_API_URL:-http://brainnexora-web}
    volumes:
      - ../IANexora:/var/www
    networks:
      - nexora-network
    depends_on:
      db:
        condition: service_healthy

  ianexora-web:
    image: nginx:alpine
    container_name: ianexora-web
    restart: unless-stopped
    tty: true
    ports:
      - "${IA_WEB_PORT:-8082}:80"
    volumes:
      - ../IANexora:/var/www
      - ./nginx/ianexora.conf:/etc/nginx/conf.d/default.conf
    networks:
      - nexora-network
    depends_on:
      - ianexora-api

  # ════════════════════════════════════════════════════════════════════════════
  # BRAIN NEXORA — API de Busca em Documentação (PHP 8.2 + Nginx)
  # ════════════════════════════════════════════════════════════════════════════
  brainnexora-api:
    build:
      context: ../brainNexora
      dockerfile: Dockerfile
    image: brainnexora-api
    container_name: brainnexora-api
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: api
      SERVICE_TAGS: dev
      APP_URL: ${BRAIN_APP_URL:-http://localhost:8083}
      GEMINI_BASE_URL: ${BRAIN_GEMINI_BASE_URL:-https://generativelanguage.googleapis.com}
      GEMINI_API_KEY: ${BRAIN_GEMINI_API_KEY:-}
      GEMINI_MODEL: ${BRAIN_GEMINI_MODEL:-gemini-2.5-flash}
    volumes:
      - ../brainNexora:/var/www
    networks:
      - nexora-network

  brainnexora-web:
    image: nginx:alpine
    container_name: brainnexora-web
    restart: unless-stopped
    tty: true
    ports:
      - "${BRAIN_WEB_PORT:-8083}:80"
    volumes:
      - ../brainNexora:/var/www
      - ./nginx/brainnexora.conf:/etc/nginx/conf.d/default.conf
    networks:
      - nexora-network
    depends_on:
      - brainnexora-api

# ==============================================================================
# NETWORKS
# ==============================================================================
networks:
  nexora-network:
    name: nexora-network
    driver: bridge

# ==============================================================================
# VOLUMES
# ==============================================================================
volumes:
  nexora-db-data:
    driver: local
